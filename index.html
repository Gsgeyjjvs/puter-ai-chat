<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puter AI Chat</title>
<style>
:root{color-scheme:dark;--bg:#090b0f;--p:#10141a;--p2:#171c23;--b:#28303a;--t:#f4f6f8;--m:#8e99a7;--a:#7c6cff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:270px 1fr;overflow:hidden}
.side{background:#0d1015;border-right:1px solid var(--b);padding:18px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:11px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#211d43;color:#bdb6ff;font-size:22px}.brand b{display:block}.brand small{color:var(--m)}
.primary{width:100%;border:0;border-radius:11px;padding:11px;background:var(--a);color:#fff;font-weight:750}.section{border-top:1px solid var(--b);padding-top:17px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#737d8a;font-weight:800;margin-bottom:12px}.field{display:block;margin:0 0 15px}.field>span{display:flex;justify-content:space-between;font-size:13px;color:#c8ced7;margin-bottom:7px}select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--b);background:var(--p2);color:var(--t)}input[type=range]{width:100%;accent-color:var(--a)}.check{display:flex;gap:9px;align-items:center;color:#c8ced7;font-size:13px}.check input{accent-color:var(--a)}
.bottom{margin-top:auto;display:grid;gap:8px}.secondary,.copy{padding:9px;border:1px solid var(--b);border-radius:9px;background:transparent;color:#bdc5cf}.secondary:hover,.copy:hover{background:var(--p2);color:#fff}
.main{min-width:0;height:100%;display:flex;flex-direction:column}.top{height:64px;flex:none;border-bottom:1px solid var(--b);padding:0 22px;display:flex;align-items:center;justify-content:space-between}.title{font-weight:800}.status{font-size:12px;color:var(--m);margin-top:3px}
.messages{flex:1;overflow-y:auto;padding:30px 18px 20px}.inner{max-width:900px;margin:auto}.empty{text-align:center;min-height:62vh;display:grid;place-content:center}.biglogo{width:58px;height:58px;margin:auto auto 18px;border-radius:18px;display:grid;place-items:center;background:#211d43;color:#bdb6ff;font-size:27px}.empty h1{font-size:32px;margin:0 0 8px}.empty p{color:var(--m);margin:0 auto;max-width:560px}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px}.chips button{background:var(--p);border:1px solid var(--b);color:#cbd2dc;border-radius:999px;padding:9px 13px}
.msg{display:flex;gap:12px;margin:0 auto 25px;max-width:900px}.avatar{flex:none;width:34px;height:34px;border-radius:10px;background:var(--p2);display:grid;place-items:center;color:#cbd2dc;font-size:10px;font-weight:850}.user .avatar{background:#282243;color:#c6bfff}.body{min-width:0;flex:1}.role{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#7f8996;margin-bottom:4px}.text{line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;color:#e9edf2}
.composerWrap{flex:none;padding:8px 18px 13px}.composer{max-width:900px;margin:auto;background:#11151b;border:1px solid #343c47;border-radius:15px;padding:11px}textarea{display:block;width:100%;resize:none;max-height:180px;min-height:30px;border:0;outline:0;background:transparent;color:var(--t);line-height:1.45}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.hint,.footer{font-size:11px;color:#707a87}.send{border:0;background:var(--a);color:#fff;border-radius:9px;padding:8px 13px;font-weight:750}.send:disabled{opacity:.45}.footer{text-align:center;padding-top:8px}.footer a{color:#9c92ff}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 15px}.messages,.composerWrap{padding-left:12px;padding-right:12px}.hint{display:none}.empty h1{font-size:28px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">✦</div><div><b>Puter Chat</b><small>AI workspace</small></div></div>
<button id="newChat" class="primary">＋ New chat</button><div class="section"><div class="label">Settings</div>
<label class="field"><span>Model</span><select id="model"></select></label>
<label class="field"><span>Temperature <b id="tempOut">0.7</b></span><input id="temp" type="range" min="0" max="2" step=".1" value=".7"></label>
<label class="check"><input id="web" type="checkbox"><span>Enable web search</span></label></div>
<div class="bottom"><button id="refresh" class="secondary">↻ Refresh models</button><button id="clear" class="secondary">Clear local chat</button></div></aside>
<main class="main"><header class="top"><div><div class="title">AI Chat</div><div id="status" class="status">Ready</div></div><button id="copy" class="copy">Copy</button></header>
<section id="messages" class="messages"><div class="inner" id="inner"></div></section>
<div class="composerWrap"><form id="form" class="composer"><textarea id="input" rows="1" placeholder="Message the AI…"></textarea><div class="row"><span class="hint">Enter to send · Shift+Enter for new line</span><button id="send" class="send">Send ↑</button></div></form>
<div class="footer">AI responses can be inaccurate. Powered by <a href="https://developer.puter.com" target="_blank" rel="noopener">Puter</a>.</div></div></main></div>
<script src="https://js.puter.com/v2/"></script><script>
const $=id=>document.getElementById(id),KEY="puter-chat-fixed-v3";
const s={messages:[],model:localStorage.getItem("puter-model")||"gpt-5-nano",temperature:+(localStorage.getItem("puter-temp")||.7),web:localStorage.getItem("puter-web")==="1",busy:false};
function save(){localStorage.setItem(KEY,JSON.stringify(s.messages));localStorage.setItem("puter-model",s.model);localStorage.setItem("puter-temp",s.temperature);localStorage.setItem("puter-web",s.web?"1":"0")}
function render(){let b=$("inner");b.innerHTML="";if(!s.messages.length){b.innerHTML='<div class="empty"><div class="biglogo">✦</div><h1>How can I help?</h1><p>Ask a question, brainstorm an idea, write code, or analyze a problem.</p><div class="chips"><button data-p="Explain APIs in simple terms">Explain APIs</button><button data-p="Help me build a JavaScript project">Build a project</button><button data-p="Give me 5 creative startup ideas">Brainstorm ideas</button></div></div>';b.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{$("input").value=x.dataset.p;resize();$("input").focus()});return}for(const m of s.messages){let r=document.createElement("div");r.className="msg "+m.role;r.innerHTML='<div class="avatar">'+(m.role==="user"?"YOU":"AI")+'</div><div class="body"><div class="role">'+(m.role==="user"?"You":"Assistant")+'</div><div class="text"></div></div>';r.querySelector(".text").textContent=m.content||"";b.appendChild(r)}$("messages").scrollTop=$("messages").scrollHeight}
function resize(){let x=$("input");x.style.height="auto";x.style.height=Math.min(x.scrollHeight,180)+"px"}function busy(v){s.busy=v;$("send").disabled=v;$("input").disabled=v;$("status").textContent=v?"Thinking…":"Ready"}
async function send(t){t=t.trim();if(!t||s.busy)return;s.messages.push({role:"user",content:t},{role:"assistant",content:""});let i=s.messages.length-1;$("input").value="";resize();render();save();busy(true);try{let msgs=s.messages.slice(0,i).map(m=>({role:m.role,content:m.content}));let o={model:s.model,temperature:s.temperature,stream:true,compaction:true};if(s.web&&s.model.toLowerCase().includes("gpt"))o.tools=[{type:"web_search"}];let r=await puter.ai.chat(msgs,o),a="";for await(let p of r){if(p.type==="text"){a+=p.text||"";s.messages[i].content=a;render()}else if(p.type==="error")throw Error(p.message||"AI stream error")}if(!a)s.messages[i].content="No response was returned."}catch(e){s.messages[i].content="Error: "+(e?.message||e);render()}finally{save();busy(false);$("input").focus()}}
async function models(){ $("status").textContent="Loading models…";try{let ms=await puter.ai.listModels(),sel=$("model");sel.innerHTML="";for(let m of ms.filter(x=>x&&x.id)){let o=document.createElement("option");o.value=m.id;o.textContent=m.name&&m.name!==m.id?m.name+" ("+m.id+")":m.id;sel.appendChild(o)}if([...sel.options].some(o=>o.value===s.model))sel.value=s.model;else if(sel.options.length){s.model=sel.options[0].value;sel.value=s.model;save()}$("status").textContent=sel.options.length+" models available"}catch(e){$("status").textContent="Model list failed";console.error(e)}}
$("form").onsubmit=e=>{e.preventDefault();send($("input").value)};$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}};$("input").oninput=resize;
$("temp").oninput=e=>{s.temperature=+e.target.value;$("tempOut").textContent=s.temperature.toFixed(1);save()};$("model").onchange=e=>{s.model=e.target.value;save()};$("web").onchange=e=>{s.web=e.target.checked;save()};
$("newChat").onclick=()=>{s.messages=[];save();render()};$("clear").onclick=()=>{if(confirm("Clear this chat?")){s.messages=[];save();render()}};$("refresh").onclick=models;
$("copy").onclick=async()=>{let x=[...s.messages].reverse().find(m=>m.role==="assistant"&&m.content);if(x)try{await navigator.clipboard.writeText(x.content);$("status").textContent="Copied";setTimeout(()=>{if(!s.busy)$("status").textContent="Ready"},1000)}catch{}};
try{s.messages=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{}$("temp").value=s.temperature;$("tempOut").textContent=s.temperature.toFixed(1);$("web").checked=s.web;render();models();
</script></body></html>
